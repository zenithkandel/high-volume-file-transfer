<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browse Storage | Rabbit Transfer</title>
    <style>
      :root {
        --bg: #f4f1eb;
        --text: #2c2b29;
        --brand: #b85b43;
        --brand-hover: #984833;
        --border: #e0dcd3;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 2rem 4rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
      }
      header a {
        text-decoration: none;
        color: var(--text);
        font-weight: 600;
        font-size: 1.2rem;
      }
      nav a {
        text-decoration: none;
        color: var(--text);
        margin-left: 2rem;
        font-size: 0.9rem;
        font-weight: 500;
      }

      .container {
        max-width: 1000px;
        margin: 4rem auto;
        padding: 0 2rem;
        flex: 1;
        width: 100%;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
      }
      h2 {
        font-family: "Georgia", serif;
        font-size: 2.5rem;
        font-weight: 400;
        color: var(--brand);
        letter-spacing: -0.5px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--text);
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 1px;
        cursor: pointer;
        transition: 0.2s;
        border-radius: 2px;
      }
      .btn:hover {
        background: #111;
      }
      .btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
      }
      th,
      td {
        text-align: left;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.95rem;
      }
      th {
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 1px;
        color: #888;
        font-weight: 600;
        background: #faf9f6;
      }
      td.action-cell {
        text-align: right;
      }

      .row-hover:hover {
        background: #faf9f6;
      }
      a.dl-link {
        color: var(--brand);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.85rem;
      }
      a.dl-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html">Rabbit Transfer</a>
      <nav>
        <a href="index.html">UPLOAD</a>
      </nav>
    </header>

    <div class="container">
      <div class="toolbar">
        <h2>Storage Drive</h2>
        <div style="display: flex; gap: 1rem">
          <button class="btn" id="btnDownloadZip" disabled>
            DOWNLOAD SELECTED AS ZIP
          </button>
          <button
            class="btn"
            id="btnDeleteSelected"
            style="background: #c62828"
            title="Delete Selected"
            disabled
          >
            DELETE SELECTED
          </button>
        </div>
      </div>

      <table id="fileTable">
        <thead>
          <tr>
            <th style="width: 40px"><input type="checkbox" id="checkAll" /></th>
            <th>File Name</th>
            <th>Size</th>
            <th>Date</th>
            <th class="action-cell">Actions</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <!-- Rendered via JS -->
        </tbody>
      </table>
    </div>

    <script src="./src/browse.js"></script>
  </body>
</html>
