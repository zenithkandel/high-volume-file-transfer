<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All your files. One inbox.</title>
    <style>
      :root {
        --bg: #f4f1eb;
        --text: #2c2b29;
        --brand: #b85b43;
        --brand-hover: #984833;
        --border: #e0dcd3;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      header {
        padding: 2rem 4rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
      }
      header a {
        text-decoration: none;
        color: var(--text);
        font-weight: 600;
        font-size: 1.2rem;
      }
      nav a {
        text-decoration: none;
        color: var(--text);
        margin-left: 2rem;
        font-size: 0.9rem;
        font-weight: 500;
      }

      .main {
        display: flex;
        flex: 1;
        flex-direction: column;
      }
      @media (min-width: 900px) {
        .main {
          flex-direction: row;
        }
      }

      .hero {
        flex: 1;
        padding: 4rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-right: 1px solid var(--border);
      }
      h1 {
        font-family: "Georgia", serif;
        font-size: clamp(3rem, 6vw, 5rem);
        line-height: 1.1;
        font-weight: 400;
        margin-bottom: 2rem;
      }
      h1 span {
        color: var(--brand);
        font-style: italic;
      }
      p.subtitle {
        font-size: 1.2rem;
        line-height: 1.6;
        max-width: 500px;
        margin-bottom: 3rem;
        color: #5a5955;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--brand);
        color: white;
        border: none;
        padding: 1rem 2rem;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 1px;
        cursor: pointer;
        transition: 0.2s;
        text-decoration: none;
        border-radius: 2px;
      }
      .btn:hover {
        background: var(--brand-hover);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-outline {
        background: transparent;
        color: var(--text);
        border: 2px solid var(--text);
      }
      .btn-outline:hover {
        background: var(--text);
        color: white;
      }

      .actions {
        display: flex;
        gap: 1rem;
      }

      .upload-panel {
        flex: 1;
        padding: 2rem;
        display: flex;
        flex-direction: column;
      }
      @media (min-width: 900px) {
        .upload-panel {
          padding: 4rem;
        }
      }

      .dropzone {
        border: 2px dashed var(--text);
        padding: 2rem;
        text-align: center;
        cursor: pointer;
        transition: 0.3s;
        background: transparent;
        position: relative;
        margin-bottom: 2rem;
        flex-grow: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .dropzone.dragover {
        background: rgba(0, 0, 0, 0.05);
      }
      .dropzone p {
        margin-top: 1rem;
        font-size: 1rem;
        font-weight: 500;
      }

      .file-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding-right: 0.5rem;
      }
      .file-item {
        background: white;
        border: 1px solid var(--border);
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
      }
      .file-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 600;
        font-size: 0.95rem;
      }
      .file-size {
        color: #888;
        font-weight: 400;
        font-size: 0.85rem;
      }
      .status-text {
        font-size: 0.85rem;
        color: var(--brand);
        font-weight: 600;
      }

      .progress-bar {
        width: 100%;
        height: 6px;
        background: #eee;
        overflow: hidden;
        margin-top: 0.5rem;
      }
      .progress-fill {
        width: 0%;
        height: 100%;
        background: var(--brand);
        transition: width 0.2s;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html">Rabbit Transfer</a>
      <nav>
        <a href="browse.html">BROWSE STORAGE ➔</a>
      </nav>
    </header>

    <main class="main">
      <div class="hero">
        <div
          style="
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 2rem;
            border-top: 2px solid var(--brand);
            padding-top: 10px;
            width: max-content;
          "
        >
          HIGH-VOLUME TRANSFER
        </div>
        <h1>All your<br /><span>files</span><br />one inbox.</h1>
        <p class="subtitle">
          Drag and drop endless amounts of files. We securely chunk, transfer,
          and piece them back together directly on your local system.
        </p>
        <div class="actions">
          <button class="btn" id="btnStartAll" disabled>START UPLOADS</button>
          <a href="browse.html" class="btn btn-outline">VIEW STORAGE</a>
        </div>
      </div>

      <div class="upload-panel">
        <div class="dropzone" id="dropzone">
          <svg
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            width="40"
            height="40"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
            ></path>
          </svg>
          <p>Click or drop multiple files here...</p>
          <input type="file" id="fileInput" multiple style="display: none" />
        </div>

        <div class="file-list" id="fileList">
          <!-- Rendered via JS -->
        </div>
      </div>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
